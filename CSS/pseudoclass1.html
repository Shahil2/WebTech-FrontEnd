<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:first-of-type{
            color: blue;
            background-color: bisque;
        }
        li:last-of-type{
            color: green;
            background-color: violet;
        }
        li:nth-child(3){
            color: aqua;
            background-color: rgb(138, 97, 35);
        }
        li:nth-child(2){
            color: rgb(29, 221, 103);
            background-color: rgb(109, 9, 9);
        }

    </style>
</head>
<body style="background-color: black; color: azure;">
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>React</li>
    </ul>
</body>
</html>

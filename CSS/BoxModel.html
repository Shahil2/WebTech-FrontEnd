<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       body{
        background-color:gray;
        text-align: center;
       } 
       .margin{
        background-color: bisque;
        margin: 50px auto;
        padding: 30px;
        font-weight: bold;
        width: 350px;
       }
       .border{
        background-color: aqua;
        padding: 30px;
        border: 2px dotted rgb(215, 22, 22);
       }
       .padding{
        background-color:brown ;
        padding: 30px;
       }
       .content{
        background-color: rgb(27, 201, 88);
        padding: 30px;
       }
    </style>
</head>
<body>
    <h1>CSS BOX MODEL</h1>
    <div class="margin">
        <h4>margin</h4>
        <div class="border">
            <h4>border</h4>
            <div class="padding">
                <h4>padding</h4>
                <div class="content">
                    <h4>content</h4>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

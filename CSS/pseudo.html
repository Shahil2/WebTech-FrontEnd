<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1::first-letter{
            color: aqua;
            font-size: 100px;
        }
        h1::after{
            content: " Aunty";
        }
        h1::before{
            content: "Hi ";
            color: blueviolet;
        }
        p::first-line{
            color: brown;
            background-color: aqua;
        }
        p::first-letter{
            font-size: 50px;

        }
        h2::selection{
            color: bisque;
            background-color: brown;
        }

    </style>
</head>
<body>
    <h1>Ramya</h1>
    <h1>Sheela </h1>
    <h2>Selection</h2>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Vel commodi iste reiciendis quasi, tempora, architecto voluptas necessitatibus laboriosam quae delectus, nostrum corrupti quibusdam. Voluptates, enim vel minus culpa praesentium nesciunt?</p>
</body>
</html>

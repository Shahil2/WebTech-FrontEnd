<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
</head>
<body>
    <center>
        <form action="" method="post">
            <fieldset>
                <legend>Signup</legend>
                <table >
                    <tr>
                        <td><label for="fname">First Name</label></td>
                        <td><input type="text" name="fname" id="fnmae" placeholder="First name"></td>
                    </tr>
                    <tr>
                        <td><label for="lname">Last Name</label></td>
                        <td><input type="text" name="lname" id="lnmae" placeholder="Last name"></td>
                    </tr>
                    <tr>
                        <td><label for="email">Email</label></td>
                        <td><input type="email" name="email" id="email" placeholder="example@gmail.com"></td>
                    </tr>
                    <tr>
                        <td><label for="phn">Phone Number</label></td>
                        <td><input type="tel" name="phn" id="phn" placeholder="Phone Number"></td>
                    </tr>
                    <tr>
                        <td><label for="password">Password</label></td>
                        <td><input type="password" name="password" id="password" ></td>
                    </tr>
                    <tr>
                        <td><button><a href="login.html">Create Account</a></button></td>
                        <td><button>Cancel</button></td>
                    </tr>
                    <tr>
                        <td><a href="login.html">Already have a Account?</a></td>
                    </tr>
                </table>
            </fieldset>
        </form>
    </center>
</body>
</html>
